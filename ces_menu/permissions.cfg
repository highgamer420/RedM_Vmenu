# ─────────────────────────────────────────────────────────────
#  CES Menu permissions  —  add `exec @ces_menu/permissions.cfg`
#  to server.cfg AFTER `ensure ces_menu`, or paste this into server.cfg.
#  ACE is hierarchical: "ces_menu" grants everything, "ces_menu.players"
#  grants every player action, and so on. A "deny" beats an "allow".
# ─────────────────────────────────────────────────────────────

# ── Admins: everything ──
add_ace group.admin ces_menu allow
add_ace group.admin command.cesmenu_refreshperms allow
add_ace group.admin command.cesmenu_reloadaddons allow

# ── Moderators: player management, no bans / world / spawning ──
add_ace group.moderator ces_menu.players allow
add_ace group.moderator ces_menu.players.ban deny
add_ace group.moderator ces_menu.players.unban deny
add_ace group.moderator ces_menu.players.immune deny
add_ace group.moderator ces_menu.noclip allow
add_ace group.moderator ces_menu.self.godmode allow
add_ace group.moderator ces_menu.self.invisible allow
add_ace group.moderator ces_menu.self.heal allow
add_ace group.moderator ces_menu.self.revive allow
add_ace group.moderator ces_menu.teleport allow
add_ace group.moderator ces_menu.misc allow

# Note: don't make group.admin inherit group.moderator here - the moderator
# "deny" lines above would then block admins from banning.

# ── Everyone (optional — Config.PublicPermissions also works) ──
# add_ace builtin.everyone ces_menu.self.clean allow
# add_ace builtin.everyone ces_menu.teleport.saved allow
# add_ace builtin.everyone ces_menu.appearance.clothing allow   # let everyone use the wardrobe
# add_ace builtin.everyone ces_menu.mounts.customize allow      # and the horse stable

# ── Give yourself admin (replace with your own identifier) ──
# add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.admin
# add_principal identifier.discord:000000000000000000 group.admin
